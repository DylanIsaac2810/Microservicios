server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # /api/cuentas/1/saldo  ->  http://cuenta-service:8081/cuentas/1/saldo
        - id: cuenta-service
          uri: ${CUENTA_URL:http://localhost:8081}
          predicates:
            - Path=/api/cuentas/**
          filters:
            - StripPrefix=1

        # /api/transacciones  ->  http://transaccion-service:8082/transacciones
        - id: transaccion-service
          uri: ${TRANSACCION_URL:http://localhost:8082}
          predicates:
            - Path=/api/transacciones/**
          filters:
            - StripPrefix=1
